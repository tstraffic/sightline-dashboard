# Railway build configuration.
#
# We add LibreOffice (headless) at the system layer so the server can convert
# admin-uploaded .docx / .doc / .pptx / .xlsx files into PDF on the fly for
# the worker portal (see lib/docx-to-pdf.js). pdfjs-dist on the client only
# renders PDFs; without this conversion, workers see "Couldn't load the
# document inline." for every Word-based SWMS.
#
# We pull only the core + writer + impress + calc components (NOT the full
# libreoffice meta-package) to keep the image around 250MB instead of 500MB.
# The fonts packages are essential — without them documents render with
# wonky font substitution.

[phases.setup]
aptPkgs = [
  "libreoffice-core",
  "libreoffice-writer",
  "libreoffice-impress",
  "libreoffice-calc",
  "fonts-liberation",
  "fonts-dejavu",
]
