<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Atomis worker favicon · "Inverted · on light" from the brand kit.
       Snow #F5F5F7 background + emerald mark, stroke opacity 0.6 to match
       the inverted card. Padded so the tilted orbit reads cleanly at
       16/32px favicon sizes. -->
  <rect width="64" height="64" rx="10" fill="#F5F5F7"/>
  <g transform="translate(32 32) scale(0.62) translate(-40 -40)">
    <g transform="rotate(-22 40 40)">
      <ellipse cx="40" cy="40" rx="30" ry="13" stroke="#10B981" stroke-width="2.6" opacity="0.6"/>
    </g>
    <circle cx="40" cy="40" r="11" fill="#10B981"/>
    <circle cx="67.81" cy="28.75" r="5.5" fill="#10B981"/>
  </g>
</svg>
