<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Atomis</title>
  <meta name="theme-color" content="#0F1115">
  <link rel="icon" type="image/svg+xml" href="/images/atomis-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist:wght@300..700&family=Geist+Mono:wght@400..500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0F1115;
      color: #F5F5F7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    .container { text-align: center; max-width: 400px; }
    .mark { margin: 0 auto 32px; opacity: 0.85; }
    .eyebrow {
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #10B981;
      margin-bottom: 18px;
    }
    h1 {
      font-family: 'Bricolage Grotesque', 'Geist', sans-serif;
      font-size: 28px;
      font-weight: 500;
      color: #F5F5F7;
      letter-spacing: -0.025em;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #8B8E95;
      margin-bottom: 28px;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
    }
    button {
      background: #10B981;
      color: #0F1115;
      border: none;
      padding: 12px 28px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.92; }
    button:active { transform: translateY(1px); }
    @media (prefers-reduced-motion: reduce) {
      .mark animateMotion, .mark animate { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="mark" viewBox="0 0 80 80" width="96" height="96" fill="none">
      <defs>
        <path id="offlineRing" d="M 67.81 28.75 A 30 13 -22 0 1 12.19 51.25 A 30 13 -22 0 1 67.81 28.75" fill="none"/>
      </defs>
      <g transform="rotate(-22 40 40)">
        <ellipse cx="40" cy="40" rx="30" ry="13" stroke="#10B981" stroke-width="2.2" opacity="0.55"/>
      </g>
      <circle cx="40" cy="40" r="11" fill="#10B981"/>
      <circle cx="0" cy="0" r="5.5" fill="#10B981">
        <animateMotion dur="7s" repeatCount="indefinite">
          <mpath href="#offlineRing"/>
        </animateMotion>
        <animate attributeName="r" values="5.5;6.5;5.5;3.2;5.5" keyTimes="0;0.25;0.5;0.75;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;1;0.92;0.55;1" keyTimes="0;0.25;0.5;0.75;1" dur="7s" repeatCount="indefinite"/>
      </circle>
    </svg>
    <p class="eyebrow">No signal</p>
    <h1>You're offline.</h1>
    <p>Check your connection and try again. We'll pick up where you left off.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
